controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

kernel:
    resource: App\Kernel
    type: attribute

api_register:
    path:       /api/register
    controller: App\Controller\RegistrationController::register
    methods:    POST

api_login:
    path:       /api/login
    controller: App\Controller\LoginController::login
    methods:    POST

api_protected:
    path:       /api/protected
    controller: App\Controller\LoginController::protected
    methods:    GET


