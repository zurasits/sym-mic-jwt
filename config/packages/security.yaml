security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            jwt: ~
            provider: app_user_provider

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS, requires_channel: '%env(bool:APP_FORCE_HTTPS)%'}
        - { path: ^/api/register, roles: PUBLIC_ACCESS, requires_channel: '%env(bool:APP_FORCE_HTTPS)%' }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY, requires_channel: '%env(bool:APP_FORCE_HTTPS)%' }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10